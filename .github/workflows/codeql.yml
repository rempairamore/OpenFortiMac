name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        shell: bash
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)
          if [ ${#candidates[@]} -gt 0 ]; then
            sudo xcode-select -s "$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
          fi
          # Read the whole output first: piping xcodebuild into head/grep -q can kill it with SIGPIPE
          XCODE_VERSION=$(xcodebuild -version)
          echo "$XCODE_VERSION"
          # The project uses Swift settings introduced in Xcode 26
          if [[ ! "$XCODE_VERSION" =~ ^Xcode\ (2[6-9]|[3-9][0-9]) ]]; then
            echo "::error::Xcode 26 or later is required"
            ls /Applications
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build OpenFortiMac
        run: |
          xcodebuild clean build \
            -project OpenFortiMac.xcodeproj \
            -scheme OpenFortiMac \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"