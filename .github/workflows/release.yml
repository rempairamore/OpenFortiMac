name: "Release"

# A new MARKETING_VERSION merged to main (or a v* tag) builds, attests, scans and
# publishes a release, then updates the Homebrew tap through an auto-merged PR.
# Pull requests only build the DMG and upload it as an artifact.
on:
  push:
    branches: [ "main" ]
    paths:
      - "OpenFortiMac.xcodeproj/project.pbxproj"
    tags: [ "v*" ]
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
    paths:
      - "OpenFortiMac/**"
      - "OpenFortiMac.xcodeproj/**"
      - "build_dmg.sh"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Cheap Linux job: decides whether this run releases, so no-op pushes never wait for a macOS runner
  prepare:
    name: Decide release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide release
        id: decide
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Pull request: build only"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "Tag $GITHUB_REF_NAME pushed: release it"
            { echo "tag=$GITHUB_REF_NAME"; echo "release=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases only come from main, not $GITHUB_REF"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to main or manual run: release the project version if it has no tag yet
          VERSIONS=$(grep -oE 'MARKETING_VERSION = [^;]+' OpenFortiMac.xcodeproj/project.pbxproj | awk '{print $3}' | sort -u)
          if [ -z "$VERSIONS" ] || [ "$(wc -l <<< "$VERSIONS")" -ne 1 ]; then
            echo "::error::Expected one MARKETING_VERSION in the project, found: $(echo "$VERSIONS" | tr '\n' ' ')"
            exit 1
          fi
          TAG="v$VERSIONS"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is new: release it"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: ${{ needs.prepare.outputs.release == 'true' && 'Build and release' || 'Build' }}
    needs: prepare
    if: github.event_name == 'pull_request' || needs.prepare.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write       # create the GitHub release and its tag
      id-token: write       # sign the build provenance with Sigstore
      attestations: write   # store the attestation on GitHub
    env:
      RELEASE: ${{ needs.prepare.outputs.release }}
      TAG: ${{ needs.prepare.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)
          if [ ${#candidates[@]} -gt 0 ]; then
            sudo xcode-select -s "$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)"
          fi
          xcodebuild -version
          # The project uses Swift settings introduced in Xcode 26
          xcodebuild -version | head -n 1 | grep -Eq '^Xcode (2[6-9]|[3-9][0-9])' \
            || { echo "::error::Xcode 26 or later is required"; ls /Applications; exit 1; }

      - name: Build universal DMG
        id: build
        run: ./build_dmg.sh

      - name: Check architectures and signature
        env:
          APP: ${{ steps.build.outputs.app }}
        run: |
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/OpenFortiMac")
          echo "Architectures: $ARCHS"
          if [[ "$ARCHS" != *arm64* || "$ARCHS" != *x86_64* ]]; then
            echo "::error::Expected a universal binary, got: $ARCHS"
            exit 1
          fi
          codesign --verify --deep --strict "$APP"

      - name: Check tag matches app version
        if: env.RELEASE == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          TAG_VERSION="${TAG#v}"
          # v1.3.1-rc.1 is a test build of 1.3.1
          if [ "${TAG_VERSION%%-*}" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match MARKETING_VERSION $VERSION"
            exit 1
          fi

      - name: Upload DMG artifact
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.dmg }}
          path: ${{ steps.build.outputs.dmg }}
          if-no-files-found: error
          retention-days: 14

      - name: Attest build provenance
        if: env.RELEASE == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.dmg }}

      - name: Scan with VirusTotal
        id: virustotal
        if: env.RELEASE == 'true'
        # A VirusTotal outage must not block the release
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          DMG: ${{ steps.build.outputs.dmg }}
          SHA256: ${{ steps.build.outputs.sha256 }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::warning::VIRUSTOTAL_API_KEY is not set, skipping the scan"
            exit 0
          fi

          ANALYSIS_ID=$(curl -sS --fail-with-body -X POST "https://www.virustotal.com/api/v3/files" \
            -H "x-apikey: $VT_API_KEY" -F "file=@$DMG" | jq -r '.data.id')
          LINK="https://www.virustotal.com/gui/file/$SHA256"
          echo "link=$LINK" >> "$GITHUB_OUTPUT"

          # The free API allows 4 requests per minute: poll every 30s for up to 3 minutes
          STATS=""
          for _ in 1 2 3 4 5 6; do
            sleep 30
            RESULT=$(curl -sS --fail-with-body "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
              -H "x-apikey: $VT_API_KEY")
            if [ "$(jq -r '.data.attributes.status' <<< "$RESULT")" = "completed" ]; then
              STATS=$(jq -r '.data.attributes.stats | "\(.malicious) malicious, \(.suspicious) suspicious, \(.undetected) undetected"' <<< "$RESULT")
              break
            fi
          done

          {
            echo "### VirusTotal"
            echo "[$LINK]($LINK): ${STATS:-analysis still running}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
          DMG: ${{ steps.build.outputs.dmg }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          VT_LINK: ${{ steps.virustotal.outputs.link }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "brew install --cask rempairamore/tap/openfortimac"
            echo '```'
            echo
            echo "Or download \`$DMG\` below. The app is not notarized: on first launch open **System Settings → Privacy & Security** and click **Open Anyway**, then **Settings → Permission → Set Up…**."
            echo
            # This version's CHANGELOG section, headings promoted one level
            awk -v heading="## v$VERSION" '$0 == heading {found=1; next} found && /^## v/ {exit} found' CHANGELOG.md \
              | sed 's/^### /## /'
            echo
            echo "## Verify this download"
            echo
            echo "Built by [GitHub Actions]($RUN_URL) from the tagged commit."
            echo
            echo "- SHA-256: \`$SHA256\`"
            echo "- Build provenance: \`gh attestation verify $DMG -R $GITHUB_REPOSITORY\`"
            if [ -n "$VT_LINK" ]; then
              echo "- VirusTotal: $VT_LINK"
            fi
          } > release-notes.md

          # --target creates the tag on this commit when it does not exist yet (release from main)
          ARGS=(--target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md)
          if [[ "$TAG" == *-* ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "$DMG" "${ARGS[@]}"

      - name: Update the Homebrew tap
        # Test tags like v1.3.1-rc.1 never reach Homebrew users
        if: env.RELEASE == 'true' && !contains(env.TAG, '-')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: update the cask by hand (version $VERSION, sha256 $SHA256)"
            exit 0
          fi

          BRANCH="openfortimac-$VERSION"
          git clone --quiet "https://x-access-token:${TAP_TOKEN}@github.com/rempairamore/homebrew-tap.git" tap
          cd tap
          git switch --quiet -c "$BRANCH"
          sed -i '' -E \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" \
            Casks/openfortimac.rb
          if git diff --quiet; then
            echo "::error::Casks/openfortimac.rb did not change"
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -am "openfortimac $VERSION"

          # Lint the cask and audit it against the release published above
          brew style Casks/openfortimac.rb
          brew tap rempairamore/tap "$PWD"
          brew audit --cask --strict --online rempairamore/tap/openfortimac

          git push --quiet origin "$BRANCH"
          export GH_TOKEN="$TAP_TOKEN"
          PR_URL=$(gh pr create --repo rempairamore/homebrew-tap --base main --head "$BRANCH" \
            --title "openfortimac $VERSION" \
            --body "Automated update for $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG (sha256 \`$SHA256\`, build provenance attested).")
          # Checks passed above, so ship it to brew users right away
          gh pr merge "$PR_URL" --merge --delete-branch
          echo "### Homebrew tap" >> "$GITHUB_STEP_SUMMARY"
          echo "Merged $PR_URL" >> "$GITHUB_STEP_SUMMARY"
